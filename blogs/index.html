<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tvastra — Blogs & Research</title>
  <style>
    :root{--bg:#080808;--text:#f3f1ec;--accent:#ff6a00}
    body{background:var(--bg);color:var(--text);font-family:DM Sans,system-ui,Arial,sans-serif;margin:0;padding:40px}
    a{color:var(--accent)}
    .page{max-width:980px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
    .post-list{display:grid;gap:20px}
    .post{padding:18px;border:1px solid rgba(255,255,255,.06)}
    .post h3{margin:0 0 8px}
    .meta{font-size:13px;color:#9b9b9b}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Blogs & Research</h1>
      <nav><a href="/">Home</a></nav>
    </header>

    <section class="post-list">
      <article class="post">
        <h3><a href="sample-post.html">Sample post — Autonomous environments</a></h3>
        <div class="meta">2026 · Tvastra</div>
        <p>Example post demonstrating the blog template and structure. Replace this with your content.</p>
      </article>

    </section>
  </div>
</body>
</html>
